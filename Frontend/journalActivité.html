<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="icon" type="image/png" href="assa-ac_LOGO.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_activity">ASSA-AC Admin - Journal d’activité</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="journalActivité.css">
    <link rel="stylesheet" href="AccueilAdmin.css">
    <link rel="stylesheet" href="adminNavigation.css">
</head>

<body class="activity-page">
    <script>
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        } catch (error) {
            console.error('Unable to restore the Admin theme.', error);
        }
    </script>
    <div id="admin-sidebar-root"></div>

    <main class="main-content activity-main">
        <header class="header">
            <button class="icon-btn menu-toggle" id="open-sidebar-btn" type="button" aria-label="Ouvrir le menu" data-i18n-aria-label="open_menu" aria-expanded="false" aria-controls="sidebar">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
            <div class="header-left page-heading">
                <div>
                    <h1 data-i18n="operation_log">Journal d'Activité</h1>
                    <p data-i18n="activity_page_description">Suivez les opérations récentes de l’administration</p>
                </div>
                <div class="search-bar">
                    <input id="searchInput" type="search" placeholder="Rechercher une action ou un utilisateur..." data-i18n-placeholder="search_action_user" aria-label="Rechercher une action ou un utilisateur" data-i18n-aria-label="search_action_user">
                </div>
            </div>

            <div class="user-interaction-group">
                <button class="icon-btn" title="Passer au mode sombre" data-i18n-title="theme_toggle_dark" id="theme-toggle" type="button" aria-label="Passer au mode sombre" data-i18n-aria-label="theme_toggle_dark">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
                <button class="icon-btn notification-btn" title="Notifications" data-i18n-title="notifications" type="button" aria-label="Notifications" data-i18n-aria-label="notifications">
                    <i class="fas fa-bell" aria-hidden="true"></i>
                </button>
                <button id="toggleLang" type="button" class="icon-btn" aria-pressed="false" title="Changer de langue" data-i18n-title="change_language" aria-label="Changer de langue" data-i18n-aria-label="change_language">
                    <i class="fas fa-language" aria-hidden="true"></i><span id="langLabel">FR</span>
                </button>
                <div class="user-info">
                    <img src="Icône profile.png" alt="Avatar" data-i18n-alt="profile_avatar" class="user-avatar">
                </div>
            </div>
        </header>


        <section class="content-area activity-content-area">
          <div class="history-management">

            <div class="filter-actions-bar">
                <label for="filter-user" data-i18n="filter_user">Utilisateur</label>
                <select id="filter-user">
                    <option value="" data-i18n="all">Tous</option>
                </select>

                <label for="filter-action" data-i18n="filter_action">Type d'Action</label>
                <select id="filter-action">
                    <option value="" data-i18n="all_types">Tous les types</option>
                    <option value="create" data-i18n="create_action">Création (Facture/Devis)</option>
                    <option value="update" data-i18n="update_action">Modification (Compagnie/Statut)</option>
                    <option value="delete" data-i18n="delete_action">Archivage/Suppression</option>
                    <option value="system" data-i18n="system_action">Connexion/Système</option>
                </select>

                <label for="filter-date" data-i18n="filter_date">Date</label>
                <select id="filter-date">
                    <option value="" data-i18n="today">Aujourd'hui</option>
                    <option value="yesterday" data-i18n="yesterday">Hier</option>
                    <option value="last7" data-i18n="last_7_days">7 derniers jours</option>
                </select>

                <button type="button" data-i18n="refresh_button"><i class="fas fa-redo" aria-hidden="true"></i> Actualiser</button>
            </div>


            <div class="log-container" aria-live="polite">
                <ul class="activity-list" aria-busy="true">
                    <li class="admin-skeleton-row"><span class="admin-skeleton admin-skeleton-block"></span></li>
                    <li class="admin-skeleton-row"><span class="admin-skeleton admin-skeleton-block"></span></li>
                    <li class="admin-skeleton-row"><span class="admin-skeleton admin-skeleton-block"></span></li>
                </ul>
            </div>

            <div id="activity-pagination" class="pagination"></div>


          </div>
        </section>
    </main>


    <script src="langSwitch.js"></script>
    <script src="journalActivité.js"></script>
    <script src="adminShell.js"></script>


</body>

</html>
