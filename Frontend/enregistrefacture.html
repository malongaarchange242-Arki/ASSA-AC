<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Facture Redevance (Formulaire & Aperçu)</title>
    <link rel="stylesheet" href="enregistrefacture.css">
    <link rel="stylesheet" href="invoice-tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="AccueilAdmin.css">
    <link rel="stylesheet" href="adminNavigation.css">
</head>

<body>
    <script>
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        } catch (error) {
            console.error('Unable to restore the Admin theme.', error);
        }
    </script>

    <div id="admin-sidebar-root"></div>

    <!-- Main Content -->
    <div class="main-content invoice-main">
        <div class="header">
            <button class="icon-btn menu-toggle" id="open-sidebar-btn" type="button" aria-label="Ouvrir le menu" data-i18n-aria-label="open_menu" aria-expanded="false" aria-controls="sidebar">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
            <h1 class="page-title page-heading" data-i18n="invoice_create_title">Créer une facture</h1>
            <div class="user-interaction-group">
                <button class="icon-btn" title="Passer au mode sombre" data-i18n-title="theme_toggle_dark" id="theme-toggle" aria-label="Passer au mode sombre" data-i18n-aria-label="theme_toggle_dark"><i
                        class="fas fa-moon" aria-hidden="true"></i></button>
                <button class="icon-btn notification-btn" title="Notifications" data-i18n-title="notifications" aria-label="Notifications" data-i18n-aria-label="notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="notifCount" hidden>0</span>
                </button>
                <button id="toggleLang" type="button" class="icon-btn" aria-pressed="false" title="Changer de langue" data-i18n-title="change_language" aria-label="Changer de langue" data-i18n-aria-label="change_language">
                    <i class="fas fa-language" aria-hidden="true"></i><span id="langLabel">FR</span>
                </button>
                <div class="user-info">
                    <img src="Icône profile.png" alt="Avatar" data-i18n-alt="profile_avatar" class="user-avatar">
                </div>
            </div>
        </div>

        <main class="invoice-page">
            <section class="invoice-intro" aria-labelledby="invoice-page-title">
                <div>
                    <p class="invoice-eyebrow"><i class="fas fa-file-invoice" aria-hidden="true"></i> <span data-i18n="invoicing">FACTURATION</span></p>
                    <h2 id="invoice-page-title" data-i18n="invoice_new_title">Nouvelle facture</h2>
                    <p data-i18n="invoice_form_description">Renseignez les informations du client et les articles avant de générer l’aperçu.</p>
                </div>
                <div class="invoice-intro-icon" aria-hidden="true">
                    <i class="fas fa-file-circle-plus"></i>
                </div>
            </section>

        <div class="invoice-card bg-white p-6 sm:pt-6 sm:px-10 sm:pb-10 rounded-2xl shadow-xl max-w-5xl mx-auto border border-gray-100">

            <div id="form-area">
                <div id="form-message"
                    class="text-center p-3 mb-6 hidden rounded-xl font-medium border transition-opacity duration-300">
                </div>

                <form id="invoice-form" onsubmit="return false;">

                    <fieldset class="formal-section">
                        <legend class="text-base font-bold text-gray-700 mb-4 px-1" data-i18n="invoice_references">Références de la Facture</legend>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                            <div>
                                <label for="issue-location" class="block text-sm font-bold text-primary mb-1" data-i18n="issued_at">Fait à</label>
                                <input type="text" id="issue-location" class="form-input" value="" data-i18n-placeholder="ex_city"
                                    placeholder="Ex: Pointe-Noire">
                            </div>
                            <div>
                                <label for="client-name" class="block text-sm font-bold text-gray-700 mb-1"><span data-i18n="client">Client</span><span class="text-red-500">*</span></label>
                                <select id="client-name" required class="form-select">
                                    <option value="" disabled selected data-i18n="select_company">Sélectionner une compagnie</option>
                                    <option value="Asky">Asky</option>
                                    <option value="Camerco">Camerco</option>
                                    <option value="Air France">Air France</option>
                                    <option value="Ethiopian Airlines">Ethiopian Airlines</option>
                                    <option value="Autre">Autre</option>
                                </select>
                            </div>
                            <div>
                                <label for="airport" class="block text-sm font-bold text-gray-700 mb-1" data-i18n="airport">Aéroport</label>
                                <input type="text" id="airport" class="form-input" data-i18n-placeholder="ex_airport"
                                    placeholder="Ex: Aéroport International Malabo">
                            </div>

                            <div class="hidden">
                                <input type="text" id="invoice-id" class="form-input" readonly value="">
                                <input type="date" id="issue-date" class="form-input" readonly>
                                <input type="text" id="purpose" class="form-input"
                                    value="Redevance de Sécurité Aérienne Régionale (RSAR)" readonly>
                                <input type="text" id="period" class="form-input" readonly>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="formal-section">
                        <legend
                            class="invoice-items-legend">
                            <span data-i18n="duty_articles">Articles de Redevance</span>
                            <button type="button" id="table-add-button" onclick="addItemRow()">
                                <i class="fas fa-plus" aria-hidden="true"></i> <span data-i18n="invoice_add_row">Ajouter une ligne</span>
                            </button>
                        </legend>

                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-300 border border-formal-border">
                                <thead class="bg-gray-100">
                                    <tr>
                                        <th
                                            class="px-2 py-2 text-center text-xs font-bold uppercase tracking-wider text-gray-700 w-12 border-r border-formal-border header-numero" data-i18n="number">
                                            N°</th>
                                        <th
                                            class="px-3 py-2 text-left text-xs font-bold uppercase tracking-wider text-gray-700 w-1/4 border-r border-formal-border header-designation" data-i18n="designation">
                                            Désignation</th>
                                        <th
                                            class="px-3 py-2 text-center text-xs font-bold uppercase tracking-wider text-gray-700 w-1/3 border-r border-formal-border" data-i18n="passengers_flights">
                                            Nbre Passagers / Vols</th>
                                        <th
                                            class="px-3 py-2 text-center text-xs font-bold uppercase tracking-wider text-gray-700 w-1/3 border-r border-formal-border" data-i18n="zone">
                                            Zone</th>
                                        <th
                                            class="px-3 py-2 text-right text-xs font-bold uppercase tracking-wider text-gray-700 w-1/3" data-i18n="total_cost">
                                            Coût Total (Frs)</th>
                                        <th
                                            class="px-1 py-2 text-center text-xs font-bold uppercase tracking-wider text-gray-700 w-10 header-delete" data-i18n="delete">
                                            Suppr.</th>
                                    </tr>
                                </thead>
                                <tbody id="items-container" class="bg-white divide-y divide-gray-200">
                                </tbody>
                                <tfoot class="bg-gray-50 border-t border-formal-border">
                                    <tr>
                                        <td colspan="2" class="col-designation"></td>
                                        <td colspan="2"
                                            class="px-3 py-2 text-right text-sm font-extrabold uppercase text-primary" data-i18n="total">
                                            TOTAL</td>
                                        <td id="grand-total"
                                            class="px-3 py-2 text-right text-base font-extrabold text-primary">0 Frs
                                            CFA</td>
                                        <td class="col-delete"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <p id="total-in-words" class="mt-4 text-sm font-semibold text-gray-800 italic"></p>

                    </fieldset>

                    <div class="form-actions-container">

                        <button type="button" onclick="showPreview()" id="preview-button"
                            class="btn-action btn-primary">
                            <span data-i18n="invoice_preview">Aperçu de la Facture</span> <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </form>

            </div>

            <div class="invoice-footer">
                <button type="button" onclick="window.location.href='AccueilAdmin.html'" id="back-button">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>
                    <span data-i18n="back">Retour</span>
                </button>
            </div>
        </div>
        </main>
    </div>

    <div id="modal-wrapper" class="hidden" aria-hidden="true">
        <div id="modal-overlay" onclick="closePreview()"></div>
        <section id="modal-container" role="dialog" aria-modal="true" aria-labelledby="preview-title" aria-describedby="preview-description">
            <div id="modal-content">

                <div id="preview-area">
                    <div id="preview-content"></div>
                </div>
            </div>
        </section>
    </div>



    <script src="langSwitch.js"></script>
    <script src="enregistrefacture.js"></script>
    <script src="adminShell.js"></script>

</body>

</html>
