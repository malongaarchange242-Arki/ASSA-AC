<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="icon" type="image/png" href="assa-ac_LOGO.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSA-AC Admin - Archives</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="ArchiveAdmin.css">
    <link rel="stylesheet" href="AccueilAdmin.css">
    <link rel="stylesheet" href="adminNavigation.css">


</head>

<body class="archive-page">
    <script>
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        } catch (error) {
            console.error('Unable to restore the Admin theme.', error);
        }
    </script>
    <div id="admin-sidebar-root"></div>

    <main class="main-content archive-main">
        <header class="header">
            <button class="icon-btn menu-toggle" id="open-sidebar-btn" type="button" aria-label="Ouvrir le menu" data-i18n-aria-label="open_menu" aria-expanded="false" aria-controls="sidebar">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
            <div class="page-heading">
                <h1 data-i18n="registry_operations">Registre des opérations</h1>
                <p data-i18n="archive_page_description">Historique des opérations clôturées</p>
            </div>
            <div class="user-interaction-group">
                <button class="icon-btn" title="Passer au mode sombre" data-i18n-title="theme_toggle_dark" id="theme-toggle" type="button" aria-label="Passer au mode sombre" data-i18n-aria-label="theme_toggle_dark">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
                <button class="icon-btn notification-btn" title="Notifications" data-i18n-title="notifications" type="button" aria-label="Notifications" data-i18n-aria-label="notifications">
                    <i class="fas fa-bell" aria-hidden="true"></i>
                </button>
                <button id="toggleLang" type="button" class="icon-btn" aria-pressed="false" title="Changer de langue" data-i18n-title="change_language" aria-label="Changer de langue" data-i18n-aria-label="change_language">
                    <i class="fas fa-language" aria-hidden="true"></i><span id="langLabel">FR</span>
                </button>
                <div class="user-info">
                    <img src="Icône profile.png" alt="Avatar" data-i18n-alt="profile_avatar" class="user-avatar">
                </div>
            </div>
        </header>

        <section class="content-area archive-content-area">
          <div class="archive-management">

            <div class="print-selector-group">
                <label for="select-month"><i class="fas fa-filter" aria-hidden="true"></i><span data-i18n="actions_period">Période des actions</span></label>
                <select id="select-month" aria-label="Période du rapport d'archive" data-i18n-aria-label="archive_period_accessible">
                    <option value="all" data-i18n="all_periods">Toutes les périodes</option>
                    <option value="current" data-i18n="current_month">Mois en cours</option>
                    <option value="last" data-i18n="last_month">Mois dernier</option>
                </select>

                <label for="select-action-type"><i class="fas fa-list" aria-hidden="true"></i><span data-i18n="filter_action_type">Type d’action</span></label>
                <select id="select-action-type" aria-label="Filtrer par type d’action" data-i18n-aria-label="filter_action_type_accessible">
                    <option value="all" data-i18n="all_action_types">Tous les types d’action</option>
                </select>

                <label for="search-actions"><i class="fas fa-search" aria-hidden="true"></i><span data-i18n="search_actions">Rechercher une action</span></label>
                <input id="search-actions" type="search" aria-label="Rechercher parmi les actions" data-i18n-aria-label="search_actions_accessible" placeholder="Référence, utilisateur ou compagnie" data-i18n-placeholder="search_actions_placeholder">

                <button id="clear-filters" type="button">
                    <i class="fas fa-rotate-left" aria-hidden="true"></i>
                    <span data-i18n="reset_filters">Réinitialiser</span>
                </button>

                <button id="csv-btn" type="button">
                    <i class="fas fa-file-csv" aria-hidden="true"></i>
                    <span data-i18n="download_summary">Télécharger le Récapitulatif (.CSV)</span>
                </button>
            </div>

            <div class="card-table-container">
                <h2 data-i18n="all_recorded_actions">Toutes les actions enregistrées</h2>
                <div class="archive-table-scroll">
                  <table class="archive-table">
                    <caption class="visually-hidden" data-i18n="all_recorded_actions">Toutes les actions enregistrées</caption>
                    <thead>
                        <tr>
                            <th data-i18n="type_col">Type</th>
                            <th data-i18n="ref_company_col">Référence / Compagnie</th>
                            <th data-i18n="archive_actor_col">Utilisateur / compagnie</th>
                            <th data-i18n="archive_date_col">Date de l'action</th>
                            <th data-i18n="actions_col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archive-body">
                        <tr class="admin-skeleton-row">
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                        </tr>
                        <tr class="admin-skeleton-row">
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                        </tr>
                        <tr class="admin-skeleton-row">
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                            <td><span class="admin-skeleton admin-skeleton-block"></span></td>
                        </tr>
                    </tbody>
                  </table>
                </div>

                <div id="pagination" class="pagination"></div>

            </div>
          </div>
        </section>
    </main>

    <!-- MODAL ARCHIVE -->
    <div class="modal-overlay" id="archiveModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle" data-i18n="archive_details">Détails de l'archive</h3>
                <button class="close-btn" type="button" aria-label="Fermer les détails" data-i18n-aria-label="archive_close_details">&times;</button>
            </div>

            <div class="modal-body" id="modalContent">
                <!-- contenu dynamique -->
            </div>


        </div>
    </div>

    <script src="langSwitch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="ArchiveAdmin.js"></script>
    <script src="adminShell.js"></script>

</body>

</html>
