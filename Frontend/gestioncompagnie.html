<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSA-AC - Gestion des Compagnies</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="AccueilAdmin.css">
    <link rel="stylesheet" href="adminNavigation.css">
    <link rel="stylesheet" href="gestioncompagnie.css">
</head>

<body>
    <script>
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        } catch (error) {
            console.error('Unable to restore the Admin theme.', error);
        }
    </script>
    <div id="admin-sidebar-root"></div>

    <main class="main-content">
        <header class="header">
            <button class="icon-btn menu-toggle" id="open-sidebar-btn" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
            <div class="page-heading">
                <h1 data-i18n="manage_companies">Gestion des Compagnies</h1>
                <p>Consultez et gérez les compagnies enregistrées</p>
            </div>
            <div class="search-bar">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input id="searchInput" type="search" placeholder="Rechercher une compagnie, un ID..." data-i18n-placeholder="search_company_id" aria-label="Rechercher une compagnie">
            </div>
            <div class="user-interaction-group">
                <button class="icon-btn" title="Mode Sombre/Clair" id="theme-toggle" type="button" aria-label="Changer de thème">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
                <button class="icon-btn notification-btn" title="Notifications" type="button" aria-label="Notifications">
                    <i class="fas fa-bell" aria-hidden="true"></i>
                </button>
                <button id="toggleLang" type="button" class="icon-btn" aria-pressed="false" title="Changer la langue" aria-label="Changer la langue">
                    <i class="fas fa-language" aria-hidden="true"></i>
                    <span id="langLabel">FR</span>
                </button>
                <div class="user-info">
                    <img src="Icône profile.png" alt="Avatar" class="user-avatar">
                </div>
            </div>
        </header>

        <section class="company-management">
            <div class="page-header">
                <div>
                    <h2 data-i18n="manage_companies">Gestion des Compagnies</h2>
                    <p>Retrouvez les informations et le statut de chaque compagnie.</p>
                </div>
                <div class="action-buttons">
                    <button class="btn-refresh" type="button" onclick="fetchCompanies()"><i class="fas fa-sync-alt" aria-hidden="true"></i><span data-i18n="refresh">Actualiser</span></button>
                    <button type="button" class="btn-add" id="add-company-button"><i class="fas fa-plus-circle" aria-hidden="true"></i><span data-i18n="add_company">Ajouter Compagnie</span></button>
                </div>
            </div>

            <div class="company-table-wrap">
                <table class="company-table" aria-label="Liste des compagnies">
                    <colgroup>
                        <col class="company-col-name">
                        <col class="company-col-representative">
                        <col class="company-col-email">
                        <col class="company-col-phone">
                        <col class="company-col-address">
                        <col class="company-col-airport">
                        <col class="company-col-status">
                        <col class="company-col-actions">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col" data-i18n="company_name_label">Compagnie</th>
                            <th scope="col" data-i18n="representative">Représentant</th>
                            <th scope="col" data-i18n="email">E-mail</th>
                            <th scope="col" data-i18n="phone">Téléphone</th>
                            <th scope="col" data-i18n="address">Adresse</th>
                            <th scope="col" data-i18n="airport_code">Code aéroport</th>
                            <th scope="col" class="company-status-heading" data-i18n="status">Statut</th>
                            <th scope="col" class="company-actions-heading" data-i18n="action">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="company-table-body" aria-live="polite"></tbody>
                </table>
            </div>
        </section>

        <dialog class="company-form-dialog" id="company-form-dialog" aria-labelledby="company-form-dialog-title">
            <div class="company-form-dialog-header">
                <h2 id="company-form-dialog-title">Ajouter une compagnie</h2>
                <button type="button" class="company-form-dialog-close" aria-label="Fermer la fenêtre">&times;</button>
            </div>
            <iframe id="company-form-frame" title="Formulaire d’enregistrement de compagnie"></iframe>
        </dialog>
    </main>

    <script src="langSwitch.js"></script>
    <script src="gestioncompagnie.js"></script>
    <script src="adminShell.js"></script>
</body>

</html>
