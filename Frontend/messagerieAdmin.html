<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSA-AC Admin - Messagerie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="messagerieAdmin.css">
    <link rel="stylesheet" href="AccueilAdmin.css">
    <link rel="stylesheet" href="adminNavigation.css">
</head>

<body class="messaging-admin-page">
    <script>
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        } catch (error) {
            console.error('Unable to restore the Admin theme.', error);
        }
    </script>
    <div id="admin-sidebar-root"></div>

    <main class="main-content messaging-main">
        <div class="header">
            <button class="icon-btn menu-toggle" id="open-sidebar-btn" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>

            <div class="header-left">
                <h1 class="page-title page-heading" data-i18n="messaging">Messagerie</h1>
                <div class="search-bar">
                    <input id="searchInput" type="search" placeholder="Rechercher la compagnie..." data-i18n-placeholder="search_company" aria-label="Rechercher une compagnie">
                </div>
            </div>

            <div class="header-right">
                <div class="user-interaction-group">

                    <button class="icon-btn" type="button" title="Mode Sombre/Clair" id="theme-toggle" aria-label="Changer de thème">
                        <i class="fas fa-moon" aria-hidden="true"></i></button>

                    <button class="icon-btn notification-btn" type="button" title="Notifications" aria-label="Notifications">
                        <i class="fas fa-bell" aria-hidden="true"></i>
                        <span class="notif-badge" id="notifCount" hidden>0</span>
                    </button>
                    <button id="toggleLang" type="button" class="icon-btn" aria-pressed="false" title="Changer la langue"><i class="fas fa-language"></i><span id="langLabel" style="font-size: 12px; margin-left: 4px;">FR</span></button>
                    <div class="user-info">
                        <img src="Icône profile.png" alt="Avatar" class="user-avatar">
                    </div>
                </div>
            </div>
        </div>

        <section class="content-area messaging-content" aria-label="Messagerie des compagnies">
            <div class="messaging-container">
                <aside class="conversations-list" aria-label="Liste des compagnies">
                    <div class="list-header">
                        <div class="list-title-row">
                            <h2 data-i18n="companies">Compagnies</h2>
                            <i class="fas fa-building" aria-hidden="true"></i>
                        </div>
                        <label class="company-search">
                            <i class="fas fa-search" aria-hidden="true"></i>
                            <input id="companySearchInput" type="search" placeholder="Rechercher une compagnie..." data-i18n-placeholder="search_company" aria-label="Rechercher une compagnie">
                        </label>
                    </div>
                    <div id="companyContainer" class="list-body" aria-live="polite">
                        <div class="messaging-skeleton" aria-hidden="true">
                            <div class="messaging-skeleton-row"></div>
                            <div class="messaging-skeleton-row"></div>
                            <div class="messaging-skeleton-row"></div>
                        </div>
                    </div>
                    <p id="company-search-empty" class="list-empty-state" data-i18n="company_search_empty" hidden>Aucune compagnie ne correspond à cette recherche.</p>
                </aside>

                <section class="chat-area" aria-label="Conversation">
                    <div class="chat-header">
                        <button class="mobile-chat-back" id="mobile-chat-back" type="button" aria-label="Retour à la liste des compagnies">
                            <i class="fas fa-arrow-left" aria-hidden="true"></i>
                        </button>
                        <img id="chat-company-avatar" src="assa-ac_LOGO.png" alt="Logo de la compagnie">
                        <div class="chat-header-details">
                            <h2 id="chat-company-name" data-i18n="select_company">Sélectionnez une compagnie</h2>
                            <p data-i18n="recent_messages">Messages récents</p>
                        </div>
                    </div>
                    <div class="chat-messages" id="chat-messages-content" aria-live="polite" aria-relevant="additions text">
                        <div class="chat-empty-state">
                            <span class="empty-state-icon"><i class="fas fa-comments" aria-hidden="true"></i></span>
                            <h3 data-i18n="select_company">Sélectionnez une compagnie</h3>
                            <p data-i18n="select_company_view">Sélectionnez une compagnie pour voir les messages ici.</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <div class="chat-composer">
                            <textarea id="messageInput" rows="1" placeholder="Écrire un message..." data-i18n-placeholder="write_your_message" aria-label="Votre message" disabled></textarea>
                            <div class="input-actions">
                                <button class="attach-btn" id="attachBtn" type="button" title="Joindre un fichier" aria-label="Joindre un fichier" disabled><i class="fas fa-paperclip" aria-hidden="true"></i></button>
                                <input type="file" id="attachmentInput" multiple hidden />
                                <button id="sendBtn" type="button" title="Envoyer le message" aria-label="Envoyer le message" disabled>
                                    <i class="fas fa-paper-plane" aria-hidden="true"></i>
                                    <i class="fas fa-circle-notch fa-spin send-spinner" aria-hidden="true" hidden></i>
                                </button>
                            </div>
                        </div>
                        <p class="send-error" id="send-error" role="alert" hidden></p>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="langSwitch.js"></script>
    <script src="script.js"></script>
    <script src="messagerieAdmin.js"></script>
    <script src="adminShell.js"></script>

</body>

</html>
